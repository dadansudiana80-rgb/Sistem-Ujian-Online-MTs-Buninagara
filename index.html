    <script>

    <style>

        }

            background: #cbd5e1;
            border-radius: 4px;
        }
        .prevent-select {
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and 12 */
            user-select: none; /* Standard syntax */
        }
        /* Lock screen pulse animation */
        @keyframes pulse-border {
            0%, 100% { border-color: rgba(239, 68, 68, 1); }

        .locked-exam-mode {

</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Custom Modal Notification Alert -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center transform transition-all scale-100">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="confirm-title" class="text-xl font-bold text-slate-800 mb-2">Konfirmasi Tindakan</h3>
            <p id="confirm-msg" class="text-slate-600 text-sm mb-6">Apakah Anda yakin ingin melanjutkan?</p>
            <div class="flex gap-3 justify-center">
                <button id="confirm-btn-cancel" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium transition">Batal</button>
                <button id="confirm-btn-ok" class="px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-medium transition shadow-lg shadow-red-200">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <!-- APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Views will be dynamically loaded here by JavaScript -->
    </div>

    <script>
        // ==========================================
        // INITIAL DATA & PERSISTENCE ENGINE
        // ==========================================
        const DEFAULT_LOGO = "https://placehold.co/120x120/16a34a/ffffff?text=MTs+Buninagara";

        const DB_KEYS = {
            ADMIN: 'mts_admin_auth',
            GURU: 'mts_guru_list',
            SISWA: 'mts_siswa_list',
            ROMBEL: 'mts_rombel_list',
            UJIAN: 'mts_ujian_list',
            HASIL: 'mts_hasil_list',
            SETTINGS: 'mts_settings'
        };

        // Initial Mock Database
        function initStorage() {
            if (!localStorage.getItem(DB_KEYS.ADMIN)) {
                localStorage.setItem(DB_KEYS.ADMIN, JSON.stringify({
                    username: 'MTsbuninagara',
                    password: 'Dadan.123'
                }));
            }

            if (!localStorage.getItem(DB_KEYS.SETTINGS)) {
                localStorage.setItem(DB_KEYS.SETTINGS, JSON.stringify({
                    namaSekolah: 'MTs Buninagara',

                }));
            }

            if (!localStorage.getItem(DB_KEYS.GURU)) {
                const initialGuru = [
                    { id: 'G1', nip: '19850112201001', nama: 'Dadan Ramdani, S.Pd', mapel: ['Matematika', 'IPA'] },
                    { id: 'G2', nip: '19880315201202', nama: 'Siti Nurhaliza, M.Pd', mapel: ['Bahasa Indonesia', 'Bahasa Inggris'] },
                    { id: 'G3', nip: '19900720201503', nama: 'Ahmad Hidayat, S.Ag', mapel: ['Fiqih', 'Akidah Akhlak'] }
                ];
                localStorage.setItem(DB_KEYS.GURU, JSON.stringify(initialGuru));
            }

            if (!localStorage.getItem(DB_KEYS.SISWA)) {
                const initialSiswa = [
                    { id: 'S1', nisn: '0081234567', nama: 'Muhammad Rizky Pratama', tglLahir: '2009-05-14', gender: 'L', rombelId: 'R1' },
                    { id: 'S2', nisn: '0087654321', nama: 'Aisyah Anindya Putri', tglLahir: '2009-08-22', gender: 'P', rombelId: 'R1' },
                    { id: 'S3', nisn: '0091122334', nama: 'Budi Santoso', tglLahir: '2008-11-05', gender: 'L', rombelId: 'R2' }
                ];
                localStorage.setItem(DB_KEYS.SISWA, JSON.stringify(initialSiswa));
            }

            if (!localStorage.getItem(DB_KEYS.ROMBEL)) {

                    { id: 'R3', nama: 'Kelas 9-A', waliKelasId: 'G3' }

            }

            if (!localStorage.getItem(DB_KEYS.UJIAN)) {

                        kkm: 75,

                            {
                                id: 'Q1',
                                jenis: 'pg',
                                pertanyaan: 'Hasil dari 12 + (-5) x 3 adalah...',
                                opsi: ['-3', '21', '-21', '3'],

                            },
                            {
                                id: 'Q2',
                                jenis: 'pg',
                                pertanyaan: 'Bentuk sederhana dari 3x + 2y - x + 5y adalah...',
                                opsi: ['2x + 7y', '4x + 7y', '2x - 3y', '3x + 7y'],
                                kunci: 0
                            },
                            {
                                id: 'Q3',
                                jenis: 'essay',
                                pertanyaan: 'Jelaskan langkah-langkah menyelesaikan persamaan linear satu variabel 2x + 4 = 12!'
                            }
                        ]
                    }
                ];
                localStorage.setItem(DB_KEYS.UJIAN, JSON.stringify(initialUjian));
            }

            if (!localStorage.getItem(DB_KEYS.HASIL)) {
                localStorage.setItem(DB_KEYS.HASIL, JSON.stringify([]));
            }
        }

        initStorage();

        // Helper Get/Set Storage
        const getDB = (key) => JSON.parse(localStorage.getItem(key) || '[]');
        const setDB = (key, data) => localStorage.setItem(key, JSON.stringify(data));

        // State Global
        let state = {
            currentUser: null, // { role: 'admin' | 'siswa', data: {...} }
            currentView: 'login', // 'login', 'dashboard', 'guru', 'siswa', 'rombel', 'ujian', 'rekap', 'pengaturan', 'ruang_ujian'
            activeUjian: null, // exam object when student is taking test
            examAnswers: {}, // { Q1: { type: 'pg', ans: 0, ragu: false }, Q2: ... }
            examTimeLeft: 0,
            examTimerInterval: null,
            examViolations: 0
        };

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                warning: 'bg-amber-500 text-white',
                info: 'bg-blue-600 text-white'
            };

            const icons = {
                success: 'fa-circle-check',
                error: 'fa-circle-xmark',
                warning: 'fa-triangle-exclamation',
                info: 'fa-circle-info'
            };

            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg ${bgColors[type]} transition-all duration-300 transform translate-y-2 opacity-0 text-sm font-medium`;
            toast.innerHTML = `<i class="fa-solid ${icons[type]} text-lg"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Custom Confirm Dialog
        function showConfirm(title, message, onOk) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = message;
            modal.classList.remove('hidden');

            const btnOk = document.getElementById('confirm-btn-ok');
            const btnCancel = document.getElementById('confirm-btn-cancel');

            const cleanup = () => {
                modal.classList.add('hidden');
                btnOk.onclick = null;
                btnCancel.onclick = null;
            };

            btnOk.onclick = () => {
                cleanup();
                onOk();
            };
            btnCancel.onclick = cleanup;
        }

        // ==========================================
        // VIEW RENDERER CONTROLLER
        // ==========================================
        function renderApp() {
            const app = document.getElementById('app');
            const settings = JSON.parse(localStorage.getItem(DB_KEYS.SETTINGS));

            if (!state.currentUser) {
                app.innerHTML = renderLoginView(settings);
                attachLoginEvents();
                return;
            }

            if (state.currentView === 'ruang_ujian') {
                app.innerHTML = renderRuangUjianView(settings);
                attachRuangUjianEvents();
                return;
            }

            // Standard Admin / Siswa Main Dashboard Shell
            app.innerHTML = `
                <div class="flex h-screen bg-slate-100 overflow-hidden">
                    <!-- Sidebar Navigation -->
                    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl z-20 transition-all duration-300">
                        <!-- Branding Header -->
                        <div class="p-5 flex items-center gap-3 border-b border-slate-800 bg-slate-950/40">
                            <img src="${settings.logoUrl}" alt="Logo" class="w-10 h-10 object-contain rounded-lg bg-white p-1 shadow-sm">
                            <div class="overflow-hidden">
                                <h1 class="font-bold text-white leading-tight truncate">${settings.namaSekolah}</h1>
                                <p class="text-xs text-emerald-400 font-medium">CBT Online Portal</p>
                            </div>
                        </div>

                        <!-- Menu Items -->
                        <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
                            ${renderNavButtons()}
                        </nav>

                        <!-- User Footer Profile -->
                        <div class="p-4 border-t border-slate-800 bg-slate-950/60 flex items-center justify-between">
                            <div class="flex items-center gap-3 overflow-hidden">
                                <div class="w-9 h-9 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-sm shadow">
                                    ${state.currentUser.role === 'admin' ? 'AD' : 'SW'}
                                </div>
                                <div class="overflow-hidden">
                                    <p class="text-xs font-semibold text-white truncate">${state.currentUser.role === 'admin' ? 'Administrator' : state.currentUser.data.nama}</p>
                                    <p class="text-[10px] text-slate-400 truncate">${state.currentUser.role === 'admin' ? 'MTs Buninagara' : 'NISN: ' + state.currentUser.data.nisn}</p>
                                </div>
                            </div>
                            <button onclick="logout()" class="text-slate-400 hover:text-rose-400 p-2 rounded-lg transition" title="Keluar">
                                <i class="fa-solid fa-right-from-bracket"></i>
                            </button>
                        </div>
                    </aside>

                    <!-- Main Content Area -->
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <!-- Top Header -->
                        <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm z-10">
                            <div class="flex items-center gap-3">
                                <h2 class="text-xl font-bold text-slate-800">${getModuleTitle()}</h2>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="text-right hidden sm:block">
                                    <p class="text-xs text-slate-500 font-medium">${new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                    <p class="text-xs text-emerald-600 font-bold">Status System: Online</p>
                                </div>
                            </div>
                        </header>

                        <!-- Main Content Viewport -->
                        <main class="flex-1 overflow-y-auto p-6 bg-slate-50">
                            ${renderActiveView()}
                        </main>
                    </div>
                </div>
            `;

            attachDynamicViewEvents();
        }

        function renderNavButtons() {
            const isAdmin = state.currentUser.role === 'admin';
            const navs = isAdmin ? [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie', color: 'text-indigo-400' },
                { id: 'guru', label: 'Data Guru & Mapel', icon: 'fa-chalkboard-user', color: 'text-emerald-400' },
                { id: 'siswa', label: 'Data Siswa', icon: 'fa-user-graduate', color: 'text-amber-400' },
                { id: 'rombel', label: 'Data Rombel & Wali', icon: 'fa-users-rectangle', color: 'text-sky-400' },
                { id: 'ujian', label: 'Ujian & Bank Soal', icon: 'fa-file-signature', color: 'text-rose-400' },
                { id: 'rekap', label: 'Rekap Hasil Ujian', icon: 'fa-file-invoice-dollar', color: 'text-teal-400' },
                { id: 'pengaturan', label: 'Pengaturan System', icon: 'fa-sliders', color: 'text-purple-400' }
            ] : [
                { id: 'dashboard', label: 'Dashboard Siswa', icon: 'fa-house-user', color: 'text-emerald-400' },
                { id: 'ujian', label: 'Daftar Ujian Aktif', icon: 'fa-pen-to-square', color: 'text-amber-400' }
            ];

            return navs.map(n => `
                <button onclick="navigateView('${n.id}')" 
                    class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition duration-200 ${state.currentView === n.id ? 'bg-emerald-600/10 text-emerald-400 border border-emerald-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}">
                    <i class="fa-solid ${n.icon} ${n.color} text-lg w-6"></i>
                    <span>${n.label}</span>
                </button>
            `).join('');
        }

        function getModuleTitle() {
            const titles = {
                dashboard: 'Dashboard Utama Overview',
                guru: 'Manajemen Data Guru & Mata Pelajaran',
                siswa: 'Manajemen Data Siswa MTs Buninagara',
                rombel: 'Manajemen Rombongan Belajar & Wali Kelas',
                ujian: 'Manajemen Jadwal Ujian & Soal Evaluasi',
                rekap: 'Rekapitulasi Nilai & Evaluasi Siswa',
                pengaturan: 'Pengaturan Akun & Logo Sekolah'
            };
            return titles[state.currentView] || 'Portal Aplikasi CBT';
        }

        function navigateView(viewId) {
            state.currentView = viewId;
            renderApp();
        }

        function logout() {
            showConfirm('Konfirmasi Logout', 'Apakah Anda yakin ingin keluar dari sistem?', () => {
                state.currentUser = null;
                state.currentView = 'login';
                showToast('Berhasil keluar dari sistem.', 'info');
                renderApp();
            });
        }

        // ==========================================
        // LOGIN VIEW & LOGIC
        // ==========================================
        function renderLoginView(settings) {
            return `
                <div class="min-h-screen bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
                    <!-- Background Decorative Circles -->
                    <div class="absolute -top-32 -left-32 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
                    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>

                    <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-white/20 relative z-10">
                        <!-- Branding -->
                        <div class="text-center mb-6">
                            <img src="${settings.logoUrl}" alt="Logo" class="w-20 h-20 object-contain mx-auto mb-3 bg-white rounded-2xl p-2 shadow-md border border-slate-100">
                            <h2 class="text-2xl font-bold text-slate-800">${settings.namaSekolah}</h2>
                            <p class="text-xs text-slate-500 mt-1 font-medium">Aplikasi Ujian Online & CBT Portal</p>
                        </div>

                        <!-- Login Role Switcher Tabs -->
                        <div class="flex p-1 bg-slate-100 rounded-2xl mb-6">
                            <button type="button" id="tab-btn-admin" onclick="switchLoginTab('admin')" class="flex-1 py-2 text-xs font-bold rounded-xl transition bg-white text-emerald-700 shadow-sm">
                                <i class="fa-solid fa-user-shield mr-1"></i> Admin
                            </button>
                            <button type="button" id="tab-btn-siswa" onclick="switchLoginTab('siswa')" class="flex-1 py-2 text-xs font-bold rounded-xl transition text-slate-500 hover:text-slate-700">
                                <i class="fa-solid fa-user-graduate mr-1"></i> Siswa
                            </button>
                        </div>

                        <!-- Form Admin -->
                        <form id="form-login-admin" onsubmit="handleAdminLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Username Admin</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" id="admin-user" required placeholder="Masukkan Username" value="MTsbuninagara"
                                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-key"></i></span>
                                    <input type="password" id="admin-pass" required placeholder="Masukkan Password" value="Dadan.123"
                                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition transform hover:-translate-y-0.5">
                                Masuk Sebagai Admin
                            </button>
                        </form>

                        <!-- Form Siswa -->
                        <form id="form-login-siswa" onsubmit="handleSiswaLogin(event)" class="space-y-4 hidden">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">NISN (Nomor Induk Siswa Nasional)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-id-card"></i></span>
                                    <input type="text" id="siswa-nisn" required placeholder="Contoh: 0081234567"
                                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Tanggal Lahir (Password)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-calendar"></i></span>
                                    <input type="date" id="siswa-tgl" required
                                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition">
                                </div>
                                <p class="text-[11px] text-slate-400 mt-1">*Gunakan tanggal lahir yang didaftarkan oleh admin.</p>
                            </div>
                            <button type="submit" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold rounded-xl shadow-lg shadow-amber-500/30 transition transform hover:-translate-y-0.5">
                                Masuk Ujian Siswa
                            </button>
                        </form>

                        <div class="mt-6 text-center text-xs text-slate-400 border-t border-slate-100 pt-4">
                            &copy; 2026 MTs Buninagara Online Examination System
                        </div>
                    </div>
                </div>
            `;
        }

        function switchLoginTab(role) {
            const btnAdmin = document.getElementById('tab-btn-admin');
            const btnSiswa = document.getElementById('tab-btn-siswa');
            const formAdmin = document.getElementById('form-login-admin');
            const formSiswa = document.getElementById('form-login-siswa');

            if (role === 'admin') {
                btnAdmin.className = "flex-1 py-2 text-xs font-bold rounded-xl transition bg-white text-emerald-700 shadow-sm";
                btnSiswa.className = "flex-1 py-2 text-xs font-bold rounded-xl transition text-slate-500 hover:text-slate-700";
                formAdmin.classList.remove('hidden');
                formSiswa.classList.add('hidden');
            } else {
                btnSiswa.className = "flex-1 py-2 text-xs font-bold rounded-xl transition bg-white text-amber-700 shadow-sm";
                btnAdmin.className = "flex-1 py-2 text-xs font-bold rounded-xl transition text-slate-500 hover:text-slate-700";
                formSiswa.classList.remove('hidden');
                formAdmin.classList.add('hidden');
            }
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const u = document.getElementById('admin-user').value.trim();
            const p = document.getElementById('admin-pass').value.trim();
            const storedAdmin = JSON.parse(localStorage.getItem(DB_KEYS.ADMIN));

            if (u === storedAdmin.username && p === storedAdmin.password) {
                state.currentUser = { role: 'admin', data: { username: u } };
                state.currentView = 'dashboard';
                showToast('Selamat datang, Admin MTs Buninagara!', 'success');
                renderApp();
            } else {
                showToast('Username atau password admin salah!', 'error');
            }
        }

        function handleSiswaLogin(e) {
            e.preventDefault();
            const nisn = document.getElementById('siswa-nisn').value.trim();
            const tgl = document.getElementById('siswa-tgl').value;

            const siswaList = getDB(DB_KEYS.SISWA);
            const found = siswaList.find(s => s.nisn === nisn && s.tglLahir === tgl);

            if (found) {
                state.currentUser = { role: 'siswa', data: found };
                state.currentView = 'dashboard';
                showToast(`Selamat datang, ${found.nama}!`, 'success');

        function filterGuruTable() {
            const query = document.getElementById('search-guru').value.toLowerCase();
            const list = getDB(DB_KEYS.GURU).filter(g => g.nama.toLowerCase().includes(query) || g.nip.toLowerCase().includes(query));
            document.getElementById('tbody-guru').innerHTML = renderGuruTableRows(list);
        }

        function openModalGuru(guruData = null) {
            const modal = document.getElementById('modal-guru');
            modal.classList.remove('hidden');
            if (guruData) {
                document.getElementById('modal-guru-title').innerText = 'Edit Data Guru';
                document.getElementById('guru-id').value = guruData.id;
                document.getElementById('guru-nip').value = guruData.nip;
                document.getElementById('guru-nama').value = guruData.nama;
                document.getElementById('guru-mapel').value = (guruData.mapel || []).join(', ');
            } else {
                document.getElementById('modal-guru-title').innerText = 'Tambah Data Guru';
                document.getElementById('form-guru').reset();
                document.getElementById('guru-id').value = '';
            }
        }

        function closeModalGuru() {
            document.getElementById('modal-guru').classList.add('hidden');
        }

        function saveGuru(e) {
            e.preventDefault();
            const id = document.getElementById('guru-id').value;
            const nip = document.getElementById('guru-nip').value.trim();
            const nama = document.getElementById('guru-nama').value.trim();
            const mapelRaw = document.getElementById('guru-mapel').value;
            const mapel = mapelRaw.split(',').map(s => s.trim()).filter(Boolean);

            let list = getDB(DB_KEYS.GURU);

            if (id) {
                // Edit
                list = list.map(g => g.id === id ? { ...g, nip, nama, mapel } : g);
                showToast('Data guru berhasil diperbarui!', 'success');
            } else {
                // Create
                const newGuru = {
                    id: 'G' + Date.now(),
                    nip,
                    nama,
                    mapel
                };
                list.push(newGuru);
                showToast('Guru baru berhasil ditambahkan!', 'success');
            }

            setDB(DB_KEYS.GURU, list);
            closeModalGuru();
            renderApp();
        }

        function editGuru(id) {
            const guru = getDB(DB_KEYS.GURU).find(g => g.id === id);
            if (guru) openModalGuru(guru);
        }

        function deleteGuru(id) {
            showConfirm('Hapus Data Guru', 'Apakah Anda yakin ingin menghapus data guru ini?', () => {
                let list = getDB(DB_KEYS.GURU).filter(g => g.id !== id);
                setDB(DB_KEYS.GURU, list);
                showToast('Data guru berhasil dihapus!', 'info');
                renderApp();
            });
        }

            document.getElementById('tbody-siswa').innerHTML = renderSiswaTableRows(listSiswa, listRombel);

                document.getElementById('siswa-input-gender').value = siswaData.gender || 'L';

            document.getElementById('modal-siswa').classList.add('hidden');

        function saveSiswa(e) {
            e.preventDefault();
            const id = document.getElementById('siswa-id').value;
            const nisn = document.getElementById('siswa-input-nisn').value.trim();
            const nama = document.getElementById('siswa-input-nama').value.trim();
            const tglLahir = document.getElementById('siswa-input-tgl').value;
            const gender = document.getElementById('siswa-input-gender').value;
            const rombelId = document.getElementById('siswa-input-rombel').value;

            let list = getDB(DB_KEYS.SISWA);

            if (id) {
                list = list.map(s => s.id === id ? { ...s, nisn, nama, tglLahir, gender, rombelId } : s);
                showToast('Data siswa berhasil diperbarui!', 'success');
            } else {
                const newSiswa = {
                    id: 'S' + Date.now(),
                    nisn,
                    nama,
                    tglLahir,
                    gender,
                    rombelId
                };
                list.push(newSiswa);
                showToast('Siswa baru berhasil ditambahkan!', 'success');
            }

            setDB(DB_KEYS.SISWA, list);
            closeModalSiswa();
            renderApp();
        }

            const siswa = getDB(DB_KEYS.SISWA).find(s => s.id === id);
            if (siswa) openModalSiswa(siswa);

        function updateMapelDropdown() {
            const guruId = document.getElementById('ujian-guru').value;
            const selectMapel = document.getElementById('ujian-mapel');
            selectMapel.innerHTML = '<option value="">-- Pilih Mapel --</option>';

            if (!guruId) return;
            const guru = getDB(DB_KEYS.GURU).find(g => g.id === guruId);
            if (guru && guru.mapel) {
                guru.mapel.forEach(m => {
                    selectMapel.innerHTML += `<option value="${m}">${m}</option>`;
                });
            }
        }

        function generateToken() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let res = '';
            for (let i = 0; i < 5; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('ujian-token').value = res;
        }

        function openModalUjian(data = null) {
            const modal = document.getElementById('modal-ujian');
            modal.classList.remove('hidden');
            if (data) {
                document.getElementById('modal-ujian-title').innerText = 'Edit Jadwal Ujian';
                document.getElementById('ujian-id').value = data.id;
                document.getElementById('ujian-nama').value = data.nama;
                document.getElementById('ujian-guru').value = data.guruId;
                updateMapelDropdown();
                document.getElementById('ujian-mapel').value = data.mapel;
                document.getElementById('ujian-rombel').value = data.rombelId;
                document.getElementById('ujian-kkm').value = data.kkm;
                document.getElementById('ujian-durasi').value = data.durasi;
                document.getElementById('ujian-token').value = data.token;
            } else {
                document.getElementById('modal-ujian-title').innerText = 'Buat Jadwal Ujian Baru';
                document.getElementById('form-ujian').reset();
                document.getElementById('ujian-id').value = '';
                generateToken();
            }
        }

        function closeModalUjian() {
            document.getElementById('modal-ujian').classList.add('hidden');
        }

        function saveUjian(e) {
            e.preventDefault();
            const id = document.getElementById('ujian-id').value;
            const nama = document.getElementById('ujian-nama').value.trim();
            const guruId = document.getElementById('ujian-guru').value;
            const mapel = document.getElementById('ujian-mapel').value;
            const rombelId = document.getElementById('ujian-rombel').value;
            const kkm = parseInt(document.getElementById('ujian-kkm').value);
            const durasi = parseInt(document.getElementById('ujian-durasi').value);
            const token = document.getElementById('ujian-token').value.toUpperCase().trim();

            let list = getDB(DB_KEYS.UJIAN);

            if (id) {
                list = list.map(u => u.id === id ? { ...u, nama, guruId, mapel, rombelId, kkm, durasi, token } : u);
                showToast('Jadwal ujian berhasil diperbarui!', 'success');
            } else {
                list.push({
                    id: 'U' + Date.now(),
                    nama,
                    guruId,
                    mapel,
                    rombelId,
                    kkm,
                    durasi,
                    token,
                    soal: []
                });
                showToast('Jadwal ujian berhasil dibuat!', 'success');
            }

            setDB(DB_KEYS.UJIAN, list);
            closeModalUjian();
            renderApp();
        }

        function editUjian(id) {
            const u = getDB(DB_KEYS.UJIAN).find(x => x.id === id);
            if (u) openModalUjian(u);
        }

        function deleteUjian(id) {
            showConfirm('Hapus Jadwal Ujian', 'Apakah Anda yakin ingin menghapus jadwal ujian ini beserta semua soalnya?', () => {
                let list = getDB(DB_KEYS.UJIAN).filter(u => u.id !== id);
                setDB(DB_KEYS.UJIAN, list);
                showToast('Jadwal ujian berhasil dihapus!', 'info');
                renderApp();
            });
        }

        function saveSoalItem(e) {
            e.preventDefault();
            const ujianId = document.getElementById('soal-ujian-id').value;
            const jenis = document.getElementById('soal-jenis').value;
            const pertanyaan = document.getElementById('soal-pertanyaan').value.trim();

            let listUjian = getDB(DB_KEYS.UJIAN);
            const targetUjian = listUjian.find(u => u.id === ujianId);

            if (!targetUjian.soal) targetUjian.soal = [];

            if (jenis === 'pg') {
                const opsi = [
                    document.getElementById('opsi-0').value.trim(),
                    document.getElementById('opsi-1').value.trim(),
                    document.getElementById('opsi-2').value.trim(),
                    document.getElementById('opsi-3').value.trim()
                ];
                const kunciRadios = document.getElementsByName('kunci_pg');
                let kunci = 0;
                for (let r of kunciRadios) {
                    if (r.checked) { kunci = parseInt(r.value); break; }
                }

                targetUjian.soal.push({
                    id: 'Q' + Date.now(),
                    jenis: 'pg',
                    pertanyaan,
                    opsi,
                    kunci
                });
            } else {
                targetUjian.soal.push({
                    id: 'Q' + Date.now(),
                    jenis: 'essay',
                    pertanyaan
                });
            }

            setDB(DB_KEYS.UJIAN, listUjian);
            showToast('Soal berhasil ditambahkan ke bank soal!', 'success');
            document.getElementById('modal-form-soal').classList.add('hidden');
            renderBankSoalList(targetUjian.soal);
        }

            showConfirm('Hapus Soal', 'Apakah Anda yakin ingin menghapus soal ini?', () => {
                let listUjian = getDB(DB_KEYS.UJIAN);
                const targetUjian = listUjian.find(u => u.id === activeBankUjianId);
                targetUjian.soal = targetUjian.soal.filter(q => q.id !== soalId);
                setDB(DB_KEYS.UJIAN, listUjian);
                renderBankSoalList(targetUjian.soal);
                showToast('Soal berhasil dihapus!', 'info');
            });
        }

        // VERIFIKASI TOKEN & MULAI UJIAN SISWA
        function verifikasiMulaiUjian(ujianId) {
            const tokenInput = document.getElementById(`input-token-${ujianId}`).value.toUpperCase().trim();
            const ujian = getDB(DB_KEYS.UJIAN).find(u => u.id === ujianId);

            if (tokenInput !== ujian.token) {
                showToast('Token Ujian Salah! Minta Token resmi dari Guru Mapel.', 'error');
                return;
            }

            if (!ujian.soal || ujian.soal.length === 0) {
                showToast('Ujian belum memiliki soal!', 'warning');
                return;
            }

            showConfirm('Mulai Ujian', 'Aplikasi akan mengaktifkan Mode Kunci Ujian. Anda tidak diperkenankan membuka aplikasi lain selama ujian berlangsung!', () => {
                // Prepare state and launch lock screen
                state.activeUjian = ujian;
                state.examTimeLeft = ujian.durasi * 60; // to seconds
                state.examAnswers = {};
                state.examViolations = 0;

                // Pre-fill answer state
                ujian.soal.forEach((q, idx) => {
                    state.examAnswers[q.id] = { type: q.jenis, ans: q.jenis === 'pg' ? null : '', ragu: false };
                });

                state.currentView = 'ruang_ujian';
                renderApp();

                // Trigger Fullscreen Mode
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                }
            });
        }

        let currentExamIndex = 0;

        function attachRuangUjianEvents() {
            startExamTimer();
            jumpToSoal(0);

            // Lockdown Anti-Cheat Listener
            window.onblur = () => handleExamViolation('Terdeteksi berpindah tab / aplikasi lain!');
            document.onmouseleave = () => handleExamViolation('Terdeteksi mengarahkan kursor keluar!');
            
            // Disable Right Click & Keyboard Shortcuts
            document.addEventListener('contextmenu', preventDefaultAction);
            document.addEventListener('keydown', preventShortcuts);
        }

        function preventDefaultAction(e) { e.preventDefault(); }
        function preventShortcuts(e) {
            if (e.ctrlKey || e.altKey || e.key === 'F12' || e.key === 'Tab') {
                e.preventDefault();
                showToast('Tombol pintasan dilarang selama ujian!', 'warning');
            }
        }

        function cleanupRuangUjianEvents() {
            clearInterval(state.examTimerInterval);
            window.onblur = null;
            document.onmouseleave = null;
            document.removeEventListener('contextmenu', preventDefaultAction);
            document.removeEventListener('keydown', preventShortcuts);
            if (document.exitFullscreen) document.exitFullscreen().catch(err => {});
        }

        function handleExamViolation(msg) {
            state.examViolations++;
            showToast(`PERINGATAN UJIAN (${state.examViolations}/3): ${msg}`, 'warning');
            if (state.examViolations >= 3) {
                showToast('Batas pelanggaran terlampaui! Hasil ujian akan otomatis dikirim.', 'error');
                submitUjianFinal();
            }
        }

        function startExamTimer() {
            state.examTimerInterval = setInterval(() => {
                state.examTimeLeft--;
                const hrs = String(Math.floor(state.examTimeLeft / 3600)).padStart(2, '0');
                const mins = String(Math.floor((state.examTimeLeft % 3600) / 60)).padStart(2, '0');
                const secs = String(state.examTimeLeft % 60).padStart(2, '0');

                const timerEl = document.getElementById('timer-display');
                if (timerEl) timerEl.innerText = `${hrs}:${mins}:${secs}`;

                if (state.examTimeLeft <= 0) {
                    clearInterval(state.examTimerInterval);
                    showToast('Waktu pengerjaan telah habis!', 'warning');
                    submitUjianFinal();
                }
            }, 1000);
        }

        function jumpToSoal(index) {
            currentExamIndex = index;
            const qList = state.activeUjian.soal;
            const q = qList[index];
            const qAns = state.examAnswers[q.id];

            // Render Active Question
            const container = document.getElementById('soal-active-container');
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-3">
                        <span class="text-xs font-bold text-emerald-400 bg-emerald-950 border border-emerald-800 px-3 py-1 rounded-full">
                            Soal No. ${index + 1} dari ${qList.length} (${q.jenis === 'pg' ? 'Pilihan Ganda' : 'Essay'})
                        </span>
                    </div>

                    <p class="text-base text-slate-100 font-medium leading-relaxed">${q.pertanyaan}</p>

                    ${q.jenis === 'pg' ? `
                        <div class="space-y-2 mt-4">
                            ${q.opsi.map((o, oIdx) => `
                                <label onclick="selectPgAnswer('${q.id}', ${oIdx})" 
                                    class="flex items-center gap-3 p-3.5 rounded-xl border transition cursor-pointer ${qAns.ans === oIdx ? 'bg-emerald-600/20 border-emerald-500 text-emerald-300' : 'bg-slate-900/60 border-slate-700 text-slate-300 hover:bg-slate-700/50'}">
                                    <input type="radio" name="active_pg_opt" ${qAns.ans === oIdx ? 'checked' : ''} class="text-emerald-500 focus:ring-0">
                                    <span class="font-bold text-xs uppercase w-5">${String.fromCharCode(65 + oIdx)}.</span>
                                    <span class="text-xs">${o}</span>
                                </label>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="mt-4">
                            <label class="block text-xs text-slate-400 mb-1">Tulis Jawaban Essay Anda:</label>
                            <textarea oninput="saveEssayAnswer('${q.id}', this.value)" rows="5" placeholder="Ketikkan uraian jawaban secara rinci..." 
                                class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-200 text-xs outline-none focus:border-emerald-500">${qAns.ans || ''}</textarea>
                        </div>
                    `}
                </div>
            `;

            // Sync Checkbox Ragu
            document.getElementById('chk-ragu').checked = !!qAns.ragu;

            updateGridNumberStatus();
        }

        function selectPgAnswer(qId, oIdx) {
            state.examAnswers[qId].ans = oIdx;
            jumpToSoal(currentExamIndex);
        }

        function saveEssayAnswer(qId, text) {
            state.examAnswers[qId].ans = text;
            updateGridNumberStatus();
        }

        function toggleRaguRagu() {
            const q = state.activeUjian.soal[currentExamIndex];
            state.examAnswers[q.id].ragu = document.getElementById('chk-ragu').checked;
            updateGridNumberStatus();
        }

        function navigateSoal(dir) {
            const max = state.activeUjian.soal.length;
            const newIndex = currentExamIndex + dir;
            if (newIndex >= 0 && newIndex < max) {
                jumpToSoal(newIndex);
            }
        }

        function updateGridNumberStatus() {
            const qList = state.activeUjian.soal;
            qList.forEach((q, idx) => {
                const btn = document.getElementById(`nav-num-${idx}`);
                if (!btn) return;

                const ans = state.examAnswers[q.id];
                const isAnswered = q.jenis === 'pg' ? ans.ans !== null : (ans.ans && ans.ans.trim().length > 0);
                const isRagu = ans.ragu;

                // Base style reset
                btn.className = "h-10 rounded-xl font-extrabold text-xs transition border flex items-center justify-center shadow-sm ";

                if (idx === currentExamIndex) {
                    btn.className += "ring-2 ring-white ring-offset-2 ring-offset-slate-900 ";
                }

                if (isRagu) {
                    // Kuning - Ragu-ragu
                    btn.className += "bg-amber-500 border-amber-300 text-slate-950";
                } else if (isAnswered) {
                    // Hijau - Sudah Dikerjakan
                    btn.className += "bg-emerald-600 border-emerald-400 text-white";
                } else {
                    // Putih - Belum Dikerjakan
                    btn.className += "bg-slate-200 border-slate-300 text-slate-900";
                }
            });
        }

        function konfirmasiSelesaiUjian() {
            showConfirm('Kirim Hasil Ujian', 'Apakah Anda yakin ingin menyelesaikan dan mengirim lembar jawaban ujian ini?', () => {
                submitUjianFinal();
            });
        }

        function submitUjianFinal() {
            cleanupRuangUjianEvents();

            const u = state.activeUjian;
            const siswa = state.currentUser.data;
            let benarPg = 0;
            let totalPg = 0;

            u.soal.forEach(q => {
                if (q.jenis === 'pg') {
                    totalPg++;
                    if (state.examAnswers[q.id].ans === q.kunci) benarPg++;
                }
            });

            const scorePg = totalPg > 0 ? Math.round((benarPg / totalPg) * 100) : 0;

            const hasilObj = {
                id: 'H' + Date.now(),
                ujianId: u.id,
                siswaId: siswa.id,
                namaSiswa: siswa.nama,
                nisn: siswa.nisn,
                rombelId: siswa.rombelId,
                mapel: u.mapel,
                nilaiPg: scorePg,
                jawaban: state.examAnswers,
                tglSelesai: new Date().toLocaleString('id-ID')
            };

            let listHasil = getDB(DB_KEYS.HASIL);
            listHasil.push(hasilObj);
            setDB(DB_KEYS.HASIL, listHasil);

            showToast('Ujian Berhasil Dikirim!', 'success');
            state.activeUjian = null;
            state.currentView = 'dashboard';
            renderApp();
        }

        // ------------------------------------------
        // 6. REKAP NILAI HASIL UJIAN
        // ------------------------------------------
        function renderRekapView() {
            const listHasil = getDB(DB_KEYS.HASIL);
            const listUjian = getDB(DB_KEYS.UJIAN);
            const listRombel = getDB(DB_KEYS.ROMBEL);

            return `
                <div class="space-y-5">
                    <!-- Filters & Download Button -->
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                        <div class="flex flex-wrap gap-2 flex-1">
                            <select id="filter-rekap-rombel" onchange="filterRekapTable()" class="p-2 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-teal-500 outline-none">
                                <option value="">-- Semua Rombel --</option>
                                ${listRombel.map(r => `<option value="${r.id}">${r.nama}</option>`).join('')}
                            </select>
                            <select id="filter-rekap-ujian" onchange="filterRekapTable()" class="p-2 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-teal-500 outline-none">
                                <option value="">-- Semua Ujian / Mapel --</option>
                                ${listUjian.map(u => `<option value="${u.id}">${u.nama}</option>`).join('')}
                            </select>
                        </div>
                        <button onclick="downloadRekapCSV()" class="px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-file-csv"></i> Unduh Rekap CSV / Excel
                        </button>
                    </div>

                    <!-- Table Rekap -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs text-slate-600">
                                <thead class="bg-slate-50 text-slate-700 font-bold border-b border-slate-200">
                                    <tr>
                                        <th class="p-4 w-12 text-center">No</th>
                                        <th class="p-4">NISN</th>
                                        <th class="p-4">Nama Siswa</th>
                                        <th class="p-4">Mata Pelajaran</th>
                                        <th class="p-4 text-center">Nilai PG</th>
                                        <th class="p-4 text-center">Status KKM</th>
                                        <th class="p-4">Waktu Selesai</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-rekap" class="divide-y divide-slate-100">
                                    ${renderRekapRows(listHasil)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRekapRows(list) {
            if (list.length === 0) {
                return `<tr><td colspan="7" class="p-8 text-center text-slate-400">Belum ada data rekap hasil ujian.</td></tr>`;
            }
            const listUjian = getDB(DB_KEYS.UJIAN);

            return list.map((h, idx) => {
                const u = listUjian.find(x => x.id === h.ujianId) || { kkm: 75 };
                const tuntas = h.nilaiPg >= u.kkm;
                return `
                    <tr class="hover:bg-slate-50">
                        <td class="p-4 text-center font-medium">${idx + 1}</td>
                        <td class="p-4 font-mono">${h.nisn}</td>
                        <td class="p-4 font-bold text-slate-800">${h.namaSiswa}</td>
                        <td class="p-4 font-medium">${h.mapel}</td>
                        <td class="p-4 text-center font-extrabold text-sm ${tuntas ? 'text-emerald-600' : 'text-rose-600'}">${h.nilaiPg}</td>
                        <td class="p-4 text-center">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${tuntas ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                ${tuntas ? 'TUNTAS' : 'REMIDI'}
                            </span>
                        </td>
                        <td class="p-4 text-slate-400 text-[11px]">${h.tglSelesai}</td>
                    </tr>
                `;
            }).join('');
        }

        function filterRekapTable() {
            const rombelId = document.getElementById('filter-rekap-rombel').value;
            const ujianId = document.getElementById('filter-rekap-ujian').value;

            let list = getDB(DB_KEYS.HASIL);
            if (rombelId) list = list.filter(h => h.rombelId === rombelId);
            if (ujianId) list = list.filter(h => h.ujianId === ujianId);

            document.getElementById('tbody-rekap').innerHTML = renderRekapRows(list);
        }

        function downloadRekapCSV() {
            const list = getDB(DB_KEYS.HASIL);
            if (list.length === 0) {
                showToast('Tidak ada data rekap untuk diunduh!', 'warning');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,No,NISN,Nama Siswa,Mata Pelajaran,Nilai PG,Waktu Selesai\n";
            list.forEach((h, idx) => {
                csvContent += `${idx + 1},"${h.nisn}","${h.namaSiswa}","${h.mapel}",${h.nilaiPg},"${h.tglSelesai}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Rekap_Nilai_MTs_Buninagara_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
            showToast('File rekap nilai berhasil diunduh!', 'success');
        }

        // ------------------------------------------
        // 7. MENU PENGATURAN SYSTEM & LOGO
        // ------------------------------------------
        function renderPengaturanView() {
            const admin = JSON.parse(localStorage.getItem(DB_KEYS.ADMIN));
            const settings = JSON.parse(localStorage.getItem(DB_KEYS.SETTINGS));

            return `
                <div class="max-w-2xl space-y-6">
                    <!-- Pengaturan Akun Admin -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-800 text-sm mb-4 border-b border-slate-100 pb-3 flex items-center gap-2">
                            <i class="fa-solid fa-user-shield text-purple-600"></i> Pengaturan Akun Admin
                        </h3>
                        <form onsubmit="saveAccountAdmin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Username Admin Baru</label>
                                <input type="text" id="setting-user" required value="${admin.username}" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-purple-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Password Admin Baru</label>
                                <input type="password" id="setting-pass" required value="${admin.password}" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-purple-500 outline-none">
                            </div>
                            <button type="submit" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow transition">
                                Ubah Akun Admin
                            </button>
                        </form>
                    </div>

                    <!-- Pengaturan Logo MTs Buninagara -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-800 text-sm mb-4 border-b border-slate-100 pb-3 flex items-center gap-2">
                            <i class="fa-solid fa-image text-emerald-600"></i> Pengaturan Logo MTs Buninagara
                        </h3>
                        <div class="space-y-4">
                            <div class="flex items-center gap-4">
                                <img id="preview-logo-img" src="${settings.logoUrl}" class="w-20 h-20 object-contain rounded-2xl border p-2 bg-white shadow-sm">
                                <div>
                                    <p class="text-xs font-semibold text-slate-700">Ganti Logo Sekolah</p>
                                    <p class="text-[11px] text-slate-400 mt-0.5">Format JPG atau PNG langsung dari komputer/laptop PC.</p>
                                </div>
                            </div>
                            <input type="file" id="input-logo-file" accept="image/png, image/jpeg" onchange="previewUploadLogo(event)" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                            <button onclick="saveLogoSekolah()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow transition">
                                Simpan Logo Baru
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveAccountAdmin(e) {
            e.preventDefault();
            const username = document.getElementById('setting-user').value.trim();
            const password = document.getElementById('setting-pass').value.trim();

            localStorage.setItem(DB_KEYS.ADMIN, JSON.stringify({ username, password }));
            showToast('Akun admin berhasil diperbarui!', 'success');
        }

        let uploadedLogoBase64 = null;

        function previewUploadLogo(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    uploadedLogoBase64 = event.target.result;
                    document.getElementById('preview-logo-img').src = uploadedLogoBase64;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveLogoSekolah() {
            if (!uploadedLogoBase64) {
                showToast('Pilih berkas gambar logo terlebih dahulu!', 'warning');
                return;
            }

            const settings = JSON.parse(localStorage.getItem(DB_KEYS.SETTINGS));
            settings.logoUrl = uploadedLogoBase64;
            localStorage.setItem(DB_KEYS.SETTINGS, JSON.stringify(settings));
            showToast('Logo sekolah MTs Buninagara berhasil diganti!', 'success');
            renderApp();
        }

        // Dynamic event attacher for view transitions
        function attachDynamicViewEvents() {
            // Placeholder for specific view post-render hooks if required
        }

        // Attach event listeners on initial document load
        function attachLoginEvents() {
            // Handled via inline attributes
        }

        // Initialize App
        window.onload = () => {
            renderApp();
        };
    </script>
</body>
</html>
